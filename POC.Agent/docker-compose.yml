services:
  agent-gateway:
    build: .
    ports:
      - "${AGENT_PORT:-8082}:8080"
    environment:
      ENVIRONMENT: "${AGENT_ENVIRONMENT:-Development}"
      AUTH_AUTHORITY: "${AUTH_INTERNAL_AUTHORITY}"
      AUTH_API_AUDIENCE: ${AUTH_INTERNAL_AUDIENCE}
      AUTH_JWKS_URL: "https://host.docker.internal:${BE_PORT}/.well-known/jwks.json"
      AGENT_VERIFY_SSL: "${AGENT_VERIFY_SSL:-true}"
      AZ_FOUNDRY_TENANT_ID: "${AZ_FOUNDRY_TENANT_ID}"
      AZ_FOUNDRY_SP_CLIENT_ID: "${AZ_FOUNDRY_SP_CLIENT_ID}"
      AZ_FOUNDRY_SP_CLIENT_SECRET: "${AZ_FOUNDRY_SP_CLIENT_SECRET}"
      AZ_FOUNDRY_PROJECT_ENDPOINT: "${AZ_FOUNDRY_PROJECT_ENDPOINT}"
      AZ_FOUNDRY_MODEL_DEPLOYMENT_NAME: "${AZ_FOUNDRY_MODEL_DEPLOYMENT_NAME}"
      DAB_HOST: host.docker.internal
      DAB_PORT: "${DAB_PORT}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
