services:
  agent-gateway:
    build: .
    ports:
      - "${AGENT_PORT:-8082}:8080"
    environment:
      ENVIRONMENT: "${AGENT_ENVIRONMENT:-Development}"
      AUTH_AUTHORITY: "${AUTH_AUTHORITY}"
      AUTH_API_AUDIENCE: "${AUTH_AGENT_CLIENT_ID}"
      AUTH_AGENT_CLIENT_ID: "${AUTH_AGENT_CLIENT_ID}"
      AUTH_AGENT_CLIENT_SECRET: "${AUTH_AGENT_CLIENT_SECRET}"
      AUTH_DAB_CLIENT_ID: "${AUTH_DAB_CLIENT_ID}"
      AUTH_JWKS_URL: "${AGENT_AUTH_JWKS_URL}"
      AUTH_TOKEN_ENDPOINT: "${AGENT_AUTH_TOKEN_ENDPOINT}"
      AZ_FOUNDRY_TENANT_ID: "${AZ_FOUNDRY_TENANT_ID}"
      AZ_FOUNDRY_SP_CLIENT_ID: "${AZ_FOUNDRY_SP_CLIENT_ID}"
      AZ_FOUNDRY_SP_CLIENT_SECRET: "${AZ_FOUNDRY_SP_CLIENT_SECRET}"
      AZ_FOUNDRY_PROJECT_ENDPOINT: "${AZ_FOUNDRY_PROJECT_ENDPOINT}"
      AZ_FOUNDRY_MODEL_DEPLOYMENT_NAME: "${AZ_FOUNDRY_MODEL_DEPLOYMENT_NAME}"
      DAB_API_SCOPE: "api://${AUTH_DAB_CLIENT_ID}/.default"
      DAB_HOST: host.docker.internal
      DAB_PORT: "${DAB_PORT}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
