services:
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    image: poc-backend
    environment:
      ENV: DEV
      ASPNETCORE_ENVIRONMENT: Development
      BAO_TOKEN: ${BAO_TOKEN}
      Auth__Authority: ${AUTH_AUTHORITY}
      Auth__Audience: ${AUTH_API_CLIENT_ID}
      Vault__Address: ${VAULT_ADDRESS}
      Cors__SpaOrigin: ${CORS_SPA_ORIGIN}
      Agent__Host: ${AGENT_HOST}
      Agent__Port: ${AGENT_PORT}
      Agent__ClientId: ${AUTH_API_CLIENT_ID}
      Agent__ClientSecret: ${AUTH_API_CLIENT_SECRET}
      Agent__TokenEndpoint: "https://host.docker.internal:8080/realms/poc/protocol/openid-connect/token"
      ASPNETCORE_URLS: http://+:8081
    extra_hosts:
      - "localhost:host-gateway"
    ports:
      - "${BE_PORT}:8081"

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        VITE_OIDC_AUTHORITY: ${AUTH_AUTHORITY}
        VITE_OIDC_CLIENT_ID: ${AUTH_APP_CLIENT_ID}
        VITE_OIDC_SCOPE: ${VITE_OIDC_SCOPE}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_OIDC_REDIRECT_URI: ${VITE_OIDC_REDIRECT_URI}
    image: poc-frontend
    depends_on:
      - backend
    ports:
      - "${FE_PORT}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
