# nginx config for the FE container — SPA fallback so client-side routes (e.g. /callback after
# the OIDC redirect) are served index.html instead of 404. Mounted by docker-compose into
# /etc/nginx/conf.d/default.conf (the FE Dockerfile does not bake it; see frontend/Dockerfile).
server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
